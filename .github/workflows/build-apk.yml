name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web files
        run: npx cap sync android

      - name: Force landscape + fullscreen
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<activity|<activity android:screenOrientation="sensorLandscape"|' $M
          S=android/app/src/main/res/values/styles.xml
          sed -i 's|</style>|<item name="android:windowFullscreen">true</item></style>|' $S || true

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HSR-Day-Simulator.apk

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: HSR-Day-Simulator-APK
          path: HSR-Day-Simulator.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 高鐵駕駛模擬器日間版 v${{ github.run_number }}
          files: HSR-Day-Simulator.apk
